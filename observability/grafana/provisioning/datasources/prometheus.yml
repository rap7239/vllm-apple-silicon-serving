apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid so the dashboard JSON (file-provisioned, not imported
    # through Grafana's UI) can reference this datasource by a known,
    # stable id. Without an explicit uid here, Grafana auto-generates one
    # at provisioning time, which the dashboard JSON's panels have no way
    # to predict -- that mismatch is what caused every panel to show
    # "No data" the first time this stack was stood up (see PHASE1_LOG.md).
    uid: prometheus-vllm
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Phase 2 task #4: in-cluster Prometheus (Prometheus Operator + a
  # ServiceMonitor, k8s/monitoring/), reached via a `kubectl port-forward`
  # bound to the host so Grafana's Docker container can reach it via
  # host.docker.internal -- Docker Desktop for Mac has no direct route into
  # kind's cluster network otherwise. Not a permanent bridge: the
  # port-forward must be running for this datasource to resolve. Same
  # metric names as the "Prometheus" datasource above (same vLLM /metrics
  # format), which is what actually proves K8s-sourced metrics are
  # dashboard-compatible.
  - name: Prometheus (K8s)
    uid: prometheus-k8s-vllm
    type: prometheus
    access: proxy
    url: http://host.docker.internal:9092
    isDefault: false
    editable: true
