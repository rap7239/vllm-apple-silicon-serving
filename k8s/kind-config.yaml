apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: vllm-local
# Environment-adaptation note (Phase 2, 2026-08-13 decision): no GPU node
# exists (M4 Mac mini). This cluster intentionally has no GPU device plugin
# and no `nvidia.com/gpu` capacity. vLLM will run as a regular pod with
# GPU requests/tolerations dropped, not faked. See README for the honesty
# note carried over from Phase 1's DCGM substitution.
nodes:
  - role: control-plane
    extraPortMappings:
      # Host 8080/8443 -> ingress controller inside the cluster, needed for
      # Phase 2 task #2 (Service + Ingress).
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    # Added for task #5's object-store durability extension: bind-mounts a
    # real directory on the Mac's own disk into this node, at cluster-create
    # time (extraMounts can't be added to an already-running cluster). A
    # PVC/local-path volume lives inside the node's own ephemeral container
    # filesystem and is destroyed by `kind delete cluster`; a hostPath
    # volume pointed at this mounted path is NOT -- it's the Mac's real
    # disk the whole time, so MinIO's data genuinely survives tearing the
    # cluster down and recreating it.
    extraMounts:
      - hostPath: /Users/rahulpunde/Documents/vllm-apple-silicon-serving/k8s/minio-data
        containerPath: /mnt/minio-data
