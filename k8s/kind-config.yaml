apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: vllm-local
# Environment-adaptation note (Phase 2, 2026-08-13 decision): no GPU node
# exists (M4 Mac mini). This cluster intentionally has no GPU device plugin
# and no `nvidia.com/gpu` capacity. vLLM will run as a regular pod with
# GPU requests/tolerations dropped, not faked. See README for the honesty
# note carried over from Phase 1's DCGM substitution.
nodes:
  - role: control-plane
    extraPortMappings:
      # Host 8080/8443 -> ingress controller inside the cluster, needed for
      # Phase 2 task #2 (Service + Ingress).
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
