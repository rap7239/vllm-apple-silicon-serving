# Throwaway pod whose only purpose is mounting the same PVC the benchmark
# Job wrote to, so `kubectl cp` has something to copy from -- PVCs aren't
# directly reachable from the host. Delete this pod once you're done
# copying results out; the PVC and its data are unaffected either way.
apiVersion: v1
kind: Pod
metadata:
  name: bench-results-helper
spec:
  containers:
    - name: helper
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: bench-results
          mountPath: /data
  volumes:
    - name: bench-results
      persistentVolumeClaim:
        claimName: bench-results-pvc
