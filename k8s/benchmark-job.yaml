# Phase 2 task #5: run the Phase 1 benchmark harness (vllm-benchmark's
# run_bench.py) as a K8s Job, in-cluster, against the vllm-cpu-demo Service
# (not a local CLI invocation against a port-forward). See PHASE2_LOG.md.
#
# --base-url uses the Service's in-cluster DNS name directly (no
# port-forward/Ingress needed -- this pod is already on the cluster
# network). --no-gpu-metrics: the powermetrics_exporter.py sidecar this
# harness normally scrapes is macOS-only and needs sudo, so it has no
# in-cluster equivalent here -- same environment-adaptation gap as
# elsewhere in Phase 2, stated rather than faked.
#
# No `ttlSecondsAfterFinished` set on purpose: auto-cleanup would delete
# this Job's pod (and its logs) before we've had a chance to inspect
# `kubectl logs` / `kubectl get pods` -- delete it manually once done.
#
# S3_* / AWS_* env: consumed by the harness's scripts/upload_results.py
# (boto3), which run_and_upload.sh calls after run_bench.py finishes, to
# push results into Garage (durable, survives cluster teardown) in addition
# to the PVC copy below (not durable across `kind delete cluster`, but kept
# for the direct comparison). The keys come from the same hand-made
# garage-credentials Secret Garage itself reads -- see
# garage-deployment.yaml -- so no credential is written in git.
#
# Objects are keyed by file name and S3 overwrites on PUT, so a new
# --variant gets new objects; reusing a variant replaces the old ones.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench-job
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: vllm-bench-job
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: vllm-bench-harness:v2
          imagePullPolicy: IfNotPresent
          args:
            - --base-url
            - http://vllm-cpu-demo:80/v1
            - --api-key
            - local-vllm-key
            - --model
            - Qwen/Qwen2.5-0.5B-Instruct
            - --dataset
            - datasets/prompts.jsonl
            - --concurrency
            - "5"
            - --variant
            - k8s-job-garage
            - --no-gpu-metrics
          env:
            - name: S3_ENDPOINT
              value: http://garage:3900
            - name: S3_BUCKET
              value: bench-results
            - name: AWS_DEFAULT_REGION
              value: garage
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: GARAGE_DEFAULT_SECRET_KEY
          volumeMounts:
            - name: bench-results
              mountPath: /app/runs
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results-pvc
